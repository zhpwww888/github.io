<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>15天涨停板块轮动监控（含高低位统计）</title>
  <!-- 国内CDN确保稳定加载 -->
  <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/axios/1.6.0/axios.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #f5f7fa; 
      font-family: "Microsoft YaHei", system-ui, sans-serif; 
      padding: 20px; 
    }
    .container { 
      max-width: 1400px; 
      margin: 0 auto; 
      background: #fff; 
      padding: 30px; 
      border-radius: 12px; 
      box-shadow: 0 2px 15px rgba(0,0,0,0.05);
    }
    .header { 
      margin-bottom: 20px; 
      border-bottom: 1px solid #eee; 
      padding-bottom: 15px;
    }
    .header h2 { 
      color: #333; 
      font-size: 24px; 
      margin-bottom: 10px;
    }
    .update-info { 
      color: #666; 
      font-size: 14px; 
    }
    #chart { 
      width: 100%; 
      height: 700px; 
      margin-bottom: 30px;
    }
    /* 高低位统计面板样式 */
    .stats-panel { 
      background: #f8f9fa; 
      border-radius: 8px; 
      padding: 20px; 
      border-left: 4px solid #409eff;
    }
    .stats-title { 
      font-size: 18px; 
      font-weight: 600; 
      color: #333; 
      margin-bottom: 20px;
    }
    .stats-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
      gap: 15px;
    }
    .stats-card { 
      background: #fff; 
      padding: 15px; 
      border-radius: 6px; 
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .plate-name { 
      color: #409eff; 
      font-weight: 600; 
      font-size: 16px; 
      margin-bottom: 10px;
    }
    .stats-item { 
      display: flex; 
      justify-content: space-between; 
      margin: 5px 0; 
      font-size: 14px;
    }
    .high-text { color: #e6a23c; font-weight: 600; }
    .low-text { color: #67c23a; font-weight: 600; }
    .normal-text { color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>📈 15天涨停板块轮动监控（含高低位统计）</h2>
      <div class="update-info">最后刷新时间：<span id="lastUpdate">--</span></div>
    </div>

    <!-- 板块轮动折线图 -->
    <div id="chart"></div>

    <!-- 高低位天数统计面板 -->
    <div class="stats-panel">
      <div class="stats-title">📊 板块高低位天数统计（15天周期）</div>
      <div class="stats-grid" id="statsContainer"></div>
    </div>
  </div>

  <script>
    // ========== 核心配置项（可自定义） ==========
    // 阿里云函数数据接口地址
    const API_URL = 'https://stock-d-crawler-lraupnvevn.cn-hangzhou.fcapp.run';
    // 高低位判定阈值（涨停家数）
    const HIGH_THRESHOLD = 8;  // ≥8家 = 高位
    const LOW_THRESHOLD = 3;   // ≤3家 = 低位
    // 自动刷新间隔（毫秒）
    const REFRESH_INTERVAL = 5 * 60 * 1000; // 5分钟

    // ========== 页面加载完成后初始化 ==========
    document.addEventListener('DOMContentLoaded', init);

    function init() {
      // 初始化ECharts实例
      const chart = echarts.init(document.getElementById('chart'));
      
      // 图表基础配置
      const chartOption = {
        tooltip: {
          trigger: 'axis',
          textStyle: { fontSize: 12 },
          // 提示框新增高低位标注
          formatter: function(params) {
            let html = `${params[0].name}<br/>`;
            params.forEach(item => {
              let levelTag = '';
              if (item.value >= HIGH_THRESHOLD) levelTag = '【高位】';
              else if (item.value <= LOW_THRESHOLD) levelTag = '【低位】';
              html += `${item.seriesName}：${item.value}家 ${levelTag}<br/>`;
            });
            return html;
          }
        },
        legend: {
          type: 'scroll',
          bottom: 10,
          textStyle: { fontSize: 12 }
        },
        grid: {
          left: '3%',
          right: '4%',
          bottom: '15%',
          top: '8%'
        },
        xAxis: {
          type: 'category',
          data: [],
          axisLabel: { fontSize: 12 }
        },
        yAxis: {
          type: 'value',
          name: '涨停家数',
          nameTextStyle: { fontSize: 12 },
          axisLabel: { fontSize: 12 },
          // 绘制高低位阈值线
          markLine: {
            silent: true,
            data: [
              {
                name: `高位阈值(${HIGH_THRESHOLD}家)`,
                yAxis: HIGH_THRESHOLD,
                lineStyle: { color: '#e6a23c', type: 'dashed' },
                label: { color: '#e6a23c', fontSize: 10 }
              },
              {
                name: `低位阈值(${LOW_THRESHOLD}家)`,
                yAxis: LOW_THRESHOLD,
                lineStyle: { color: '#67c23a', type: 'dashed' },
                label: { color: '#67c23a', fontSize: 10 }
              }
            ]
          }
        },
        series: []
      };

      // 首次加载数据
      loadData(chart, chartOption);
      // 设置定时刷新
      setInterval(() => loadData(chart, chartOption), REFRESH_INTERVAL);
      // 窗口大小变化时重绘图表
      window.addEventListener('resize', () => chart.resize());
    }

    // ========== 加载数据并渲染图表+统计面板 ==========
    async function loadData(chart, option) {
      try {
        // 请求阿里云函数数据
        const response = await axios.get(API_URL);
        const { data: plateDataList } = response.data;
        
        // 处理数据
        const dates = plateDataList.map(item => item.date).sort();
        const allPlates = new Set();
        plateDataList.forEach(item => {
          item.plates.forEach(plate => allPlates.add(plate.name));
        });
        const plateNames = Array.from(allPlates);

        // 组装图表系列数据
        const seriesData = plateNames.map(plateName => {
          const data = dates.map(date => {
            const dayData = plateDataList.find(item => item.date === date);
            const plateInfo = dayData?.plates.find(p => p.name === plateName);
            return plateInfo ? plateInfo.count : 0;
          });
          return {
            name: plateName,
            type: 'line',
            smooth: true,
            data: data,
            lineStyle: { width: 2 },
            itemStyle: {
              color: getPlateColor(plateName) // 不同板块不同颜色
            }
          };
        });

        // 更新图表配置
        option.xAxis.data = dates;
        option.series = seriesData;
        chart.setOption(option);

        // 更新最后刷新时间
        document.getElementById('lastUpdate').textContent = new Date().toLocaleString();

        // 渲染高低位统计面板
        renderStatsPanel(plateNames, plateDataList, dates);

      } catch (error) {
        console.error('数据加载失败:', error);
        alert(`数据加载失败，请稍后重试！\n错误信息：${error.message}`);
      }
    }

    // ========== 渲染高低位统计面板 ==========
    function renderStatsPanel(plateNames, allData, dates) {
      const container = document.getElementById('statsContainer');
      container.innerHTML = ''; // 清空原有内容

      plateNames.forEach(plateName => {
        // 统计该板块的高低位天数
        let highDays = 0;
        let lowDays = 0;
        let totalDays = 0;

        dates.forEach(date => {
          const dayData = allData.find(item => item.date === date);
          if (dayData) {
            const plateInfo = dayData.plates.find(p => p.name === plateName);
            if (plateInfo) {
              totalDays++;
              if (plateInfo.count >= HIGH_THRESHOLD) highDays++;
              if (plateInfo.count <= LOW_THRESHOLD) lowDays++;
            }
          }
        });

        // 计算占比
        const highRate = totalDays > 0 ? ((highDays / totalDays) * 100).toFixed(1) : '0.0';
        const lowRate = totalDays > 0 ? ((lowDays / totalDays) * 100).toFixed(1) : '0.0';
        const normalDays = totalDays - highDays - lowDays;
        const normalRate = totalDays > 0 ? ((normalDays / totalDays) * 100).toFixed(1) : '0.0';

        // 创建统计卡片
        const card = document.createElement('div');
        card.className = 'stats-card';
        card.innerHTML = `
          <div class="plate-name">${plateName}</div>
          <div class="stats-item">
            <span>高位天数（≥${HIGH_THRESHOLD}家）：</span>
            <span class="high-text">${highDays}天（${highRate}%）</span>
          </div>
          <div class="stats-item">
            <span>低位天数（≤${LOW_THRESHOLD}家）：</span>
            <span class="low-text">${lowDays}天（${lowRate}%）</span>
          </div>
          <div class="stats-item">
            <span>中位天数：</span>
            <span class="normal-text">${normalDays}天（${normalRate}%）</span>
          </div>
          <div class="stats-item">
            <span>总出现天数：</span>
            <span class="normal-text">${totalDays}天</span>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // ========== 辅助函数：为不同板块分配颜色 ==========
    function getPlateColor(plateName) {
      const colorMap = {
        '人工智能': '#e6a23c',
        '半导体': '#67c23a',
        '新能源': '#409eff',
        '光伏概念': '#909399',
        '算力': '#f56c6c',
        '机器人': '#722ed1',
        '军工': '#1989fa',
        '医药生物': '#52c41a'
      };
      // 如果没有匹配的颜色，返回随机颜色
      return colorMap[plateName] || `#${Math.floor(Math.random()*16777215).toString(16)}`;
    }
  </script>
</body>
</html>
