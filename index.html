<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>15天涨停板块轮动监控（含完整概率分析）</title>
  <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/axios/1.6.0/axios.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #f5f7fa; 
      font-family: "Microsoft YaHei", system-ui, sans-serif; 
      padding: 20px; 
    }
    .container { 
      max-width: 1400px; 
      margin: 0 auto; 
      background: #fff; 
      padding: 30px; 
      border-radius: 12px; 
      box-shadow: 0 2px 15px rgba(0,0,0,0.05);
    }
    .header { 
      margin-bottom: 20px; 
      border-bottom: 1px solid #eee; 
      padding-bottom: 15px;
    }
    .header h2 { 
      color: #333; 
      font-size: 24px; 
      margin-bottom: 10px;
    }
    .update-info { 
      color: #666; 
      font-size: 14px; 
    }
    #chart { 
      width: 100%; 
      height: 800px; 
      margin-bottom: 30px;
    }

    .stats-panel { 
      background: #f8f9fa; 
      border-radius: 8px; 
      padding: 20px; 
      border-left: 4px solid #409eff;
      margin-bottom: 25px;
    }
    .stats-title { 
      font-size: 18px; 
      font-weight: 600; 
      color: #333; 
      margin-bottom: 20px;
    }
    .stats-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
      gap: 10px;
    }
    .stats-card { 
      background: #fff; 
      padding: 15px; 
      border-radius: 6px; 
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .plate-name { 
      color: #409eff; 
      font-weight: 600; 
      font-size: 16px; 
      margin-bottom: 10px;
    }
    .stats-item { 
      display: flex; 
      justify-content: space-between; 
      margin: 5px 0; 
      font-size: 14px;
    }
    .high-text { color: #e6a23c; font-weight: 600; }
    .low-text { color: #67c23a; font-weight: 600; }
    .normal-text { color: #666; }

    /* 推荐/不推荐区域样式 */
    .recommend-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .recommend-panel {
      background: #fff7e6;
      border-left: 4px solid #ff7d00;
      border-radius: 8px;
      padding: 20px;
    }
    .unrecommend-panel {
      background: #fff0f0;
      border-left: 4px solid #ff4d4f;
      border-radius: 8px;
      padding: 20px;
    }
    .recommend-title {
      font-size: 18px;
      font-weight: 600;
      color: #cf6300;
      margin-bottom: 15px;
    }
    .unrecommend-title {
      font-size: 18px;
      font-weight: 600;
      color: #d32f2f;
      margin-bottom: 15px;
    }
    .recommend-item, .unrecommend-item {
      font-size: 15px;
      margin: 8px 0;
      padding-left: 10px;
      position: relative;
    }
    .recommend-item:before {
      content: "★";
      position: absolute;
      left: 0;
      color: #ff7d00;
    }
    .unrecommend-item:before {
      content: "✘";
      position: absolute;
      left: 0;
      color: #ff4d4f;
    }
    .reason {
      font-size: 13px;
      color: #666;
      margin-left: 20px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h2>📈 15天涨停板块轮动监控（含完整概率分析）</h2>
    <div class="update-info">最后刷新时间：<span id="lastUpdate">--</span></div>
  </div>

  <!-- 板块轮动折线图 -->
  <div id="chart"></div>

  <!-- 高低位统计面板 -->
  <div class="stats-panel">
    <div class="stats-title">📊 板块高低位天数统计（15天周期）</div>
    <div class="stats-grid" id="statsContainer"></div>
  </div>

  <!-- 推荐/不推荐双区域 -->
  <div class="recommend-wrap">
    <!-- 推荐买入板块 -->
    <div class="recommend-panel" id="recommendContainer"></div>
    <!-- 不推荐买入板块 -->
    <div class="unrecommend-panel" id="unrecommendContainer"></div>
  </div>
</div>

<script>
  // ========== 核心配置项 ==========
  const API_URL = 'https://stock-d-crawler-lraupnvevn.cn-hangzhou.fcapp.run';
  const HIGH_THRESHOLD = 8;    // 高位阈值（≥8家）
  const LOW_THRESHOLD = 3;     // 低位阈值（≤3家）
  const REFRESH_INTERVAL = 5 * 60 * 1000; // 5分钟刷新

  // 页面初始化
  document.addEventListener('DOMContentLoaded', init);

  function init() {
    // 初始化ECharts图表
    const chart = echarts.init(document.getElementById('chart'));
    const chartOption = {
      tooltip: {
        trigger: 'axis',
        formatter: params => {
          let html = `${params[0].name}<br/>`;
          params.forEach(item => {
            let tag = '';
            if (item.value >= HIGH_THRESHOLD) tag = '【高位】';
            else if (item.value <= LOW_THRESHOLD) tag = '【低位】';
            html += `${item.seriesName}：${item.value}家 ${tag}<br/>`;
          });
          return html;
        }
      },
      legend: {
        type: 'scroll',
        bottom: 20,
        pageIconSize: 12,
        pageTextStyle: { fontSize: 11 },
        textStyle: { fontSize: 11 }
      },
      grid: { left: '3%', right: '4%', bottom: '15%', top: '8%' },
      xAxis: { type: 'category', data: [] },
      yAxis: {
        type: 'value', 
        name: '涨停家数',
        // 高低位阈值线
        markLine: {
          silent: true,
          data: [
            { name: `高位(${HIGH_THRESHOLD}家)`, yAxis: HIGH_THRESHOLD, lineStyle: { color: '#e6a23c', type: 'dashed' } },
            { name: `低位(${LOW_THRESHOLD}家)`, yAxis: LOW_THRESHOLD, lineStyle: { color: '#67c23a', type: 'dashed' } }
          ]
        }
      },
      series: []
    };

    // 首次加载数据
    loadData(chart, chartOption);
    // 定时刷新
    setInterval(() => loadData(chart, chartOption), REFRESH_INTERVAL);
    // 窗口自适应
    window.addEventListener('resize', () => chart.resize());
  }

  // 加载数据并渲染所有模块
  async function loadData(chart, option) {
    try {
      // 请求阿里云函数数据
      const response = await axios.get(API_URL);
      const { data: plateDataList } = response.data;
      
      // 处理基础数据
      const dates = plateDataList.map(item => item.date).sort();
      const allPlates = new Set();
      plateDataList.forEach(item => item.plates.forEach(plate => allPlates.add(plate.name)));
      const plateNames = Array.from(allPlates);

      // 组装图表系列数据
      const seriesData = plateNames.map(name => ({
        name,
        type: 'line',
        smooth: true,
        data: dates.map(date => {
          const dayData = plateDataList.find(item => item.date === date);
          return dayData?.plates.find(p => p.name === name)?.count || 0;
        })
      }));

      // 更新图表
      option.xAxis.data = dates;
      option.series = seriesData;
      chart.setOption(option);

      // 更新最后刷新时间
      document.getElementById('lastUpdate').textContent = new Date().toLocaleString();

      // 渲染高低位统计面板
      renderStatsPanel(plateNames, plateDataList, dates);
      // 渲染推荐/不推荐板块
      renderRecommendPanel(plateNames, plateDataList, dates);

    } catch (error) {
      console.error('数据加载失败:', error);
      alert(`数据加载失败，请稍后重试！\n错误信息：${error.message}`);
    }
  }

  // 渲染高低位统计面板
  function renderStatsPanel(plateNames, allData, dates) {
    const container = document.getElementById('statsContainer');
    container.innerHTML = '';

    plateNames.forEach(name => {
      let highDays = 0, lowDays = 0, totalDays = 0;
      dates.forEach(date => {
        const dayData = allData.find(item => item.date === date);
        const plateInfo = dayData?.plates.find(p => p.name === name);
        if (plateInfo) {
          totalDays++;
          if (plateInfo.count >= HIGH_THRESHOLD) highDays++;
          if (plateInfo.count <= LOW_THRESHOLD) lowDays++;
        }
      });

      const normalDays = totalDays - highDays - lowDays;
      const highRate = totalDays ? ((highDays / totalDays) * 100).toFixed(1) : '0.0';
      const lowRate = totalDays ? ((lowDays / totalDays) * 100).toFixed(1) : '0.0';
      const normalRate = totalDays ? ((normalDays / totalDays) * 100).toFixed(1) : '0.0';

      // 创建统计卡片
      const card = document.createElement('div');
      card.className = 'stats-card';
      card.innerHTML = `
        <div class="plate-name">${name}</div>
        <div class="stats-item"><span>高位天数：</span><span class="high-text">${highDays}天 (${highRate}%)</span></div>
        <div class="stats-item"><span>低位天数：</span><span class="low-text">${lowDays}天 (${lowRate}%)</span></div>
        <div class="stats-item"><span>中位天数：</span><span class="normal-text">${normalDays}天 (${normalRate}%)</span></div>
        <div class="stats-item"><span>总出现天数：</span><span class="normal-text">${totalDays}天</span></div>
      `;
      container.appendChild(card);
    });
  }

  // 渲染推荐/不推荐板块（核心新增不推荐逻辑）
  function renderRecommendPanel(plateNames, allData, dates) {
    // ========== 1. 计算每个板块的统计学指标 ==========
    const plateMetrics = [];
    plateNames.forEach(name => {
      let highDays = 0, lowDays = 0, totalDays = 0;
      let sumCount = 0, validCount = 0;
      let last3Days = []; // 近3天数据

      dates.forEach(date => {
        const dayData = allData.find(item => item.date === date);
        const plateInfo = dayData?.plates.find(p => p.name === name);
        if (plateInfo) {
          totalDays++;
          sumCount += plateInfo.count;
          validCount++;
          
          if (plateInfo.count >= HIGH_THRESHOLD) highDays++;
          if (plateInfo.count <= LOW_THRESHOLD) lowDays++;

          // 记录近3天数据
          if (last3Days.length < 3) last3Days.push(plateInfo.count);
        }
      });

      // 过滤数据量不足的板块（至少出现3天）
      if (totalDays < 3) return;

      // 核心指标计算
      const avgCount = sumCount / validCount; // 平均涨停家数
      const highRate = highDays / totalDays;  // 高位概率
      const lowRate = lowDays / totalDays;    // 低位概率
      const last3Avg = last3Days.reduce((a, b) => a + b, 0) / last3Days.length; // 近3天均值

      // 综合得分：高位概率(60%) + 平均涨停(40%) → 越高越推荐
      const score = (highRate * 60) + (avgCount * 4);

      plateMetrics.push({
        name, highDays, lowDays, totalDays,
        avgCount, highRate, lowRate, last3Avg,
        score
      });
    });

    // ========== 2. 排序并筛选推荐/不推荐板块 ==========
    // 按综合得分降序排序
    plateMetrics.sort((a, b) => b.score - a.score);
    // 推荐：前4名（得分最高）
    const recommendList = plateMetrics.slice(0, 4);
    // 不推荐：后4名（得分最低，低位概率高）
    const unrecommendList = plateMetrics.slice(-4).reverse();

    // ========== 3. 渲染推荐买入板块 ==========
    const recommendContainer = document.getElementById('recommendContainer');
    recommendContainer.innerHTML = `<div class="recommend-title">🎯 统计学推荐买入（Top4）</div>`;
    
    if (recommendList.length === 0) {
      recommendContainer.innerHTML += `<div class="recommend-item">暂无足够数据推荐</div>`;
    } else {
      recommendList.forEach((item, idx) => {
        const el = document.createElement('div');
        el.className = 'recommend-item';
        el.innerHTML = `
          <strong>${idx + 1}. ${item.name}</strong>
          <div class="reason">
            高位概率：${(item.highRate * 100).toFixed(1)}%｜平均涨停：${item.avgCount.toFixed(1)}家
            <br>近3天均值：${item.last3Avg.toFixed(1)}家｜综合得分：${item.score.toFixed(1)}
            <br>结论：近期强势概率最高，适合重点关注
          </div>
        `;
        recommendContainer.appendChild(el);
      });
    }

    // ========== 4. 渲染不推荐买入板块 ==========
    const unrecommendContainer = document.getElementById('unrecommendContainer');
    unrecommendContainer.innerHTML = `<div class="unrecommend-title">⚠️ 统计学不推荐买入（Bottom4）</div>`;
    
    if (unrecommendList.length === 0) {
      unrecommendContainer.innerHTML += `<div class="unrecommend-item">暂无足够数据判断</div>`;
    } else {
      unrecommendList.forEach((item, idx) => {
        const el = document.createElement('div');
        el.className = 'unrecommend-item';
        el.innerHTML = `
          <strong>${idx + 1}. ${item.name}</strong>
          <div class="reason">
            低位概率：${(item.lowRate * 100).toFixed(1)}%｜平均涨停：${item.avgCount.toFixed(1)}家
            <br>近3天均值：${item.last3Avg.toFixed(1)}家｜综合得分：${item.score.toFixed(1)}
            <br>结论：近期弱势概率最高，建议暂时规避
          </div>
        `;
        unrecommendContainer.appendChild(el);
      });
    }
  }
</script>
</body>
</html>
