<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>15天涨停板块轮动监控</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios"></script>
  <style>
    body { margin: 0; padding: 20px; background: #f5f7fa; font-family: system-ui; }
    .card { max-width: 1400px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    #chart { width: 100%; height: 700px; margin-top: 20px; }
    .info { color: #666; font-size: 14px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📈 15天涨停板块轮动监控</h2>
    <div class="info">最后刷新：<span id="lastUpdate">--</span></div>
    <div id="chart"></div>
  </div>

  <script>
    // ========== 这里替换成你的阿里云函数公网地址 ==========
    const FUNCTION_URL = 'http://stock-d-crawler-lraupnvevn.cn-hangzhou.fcapp.run';
    // =====================================================

    const chart = echarts.init(document.getElementById('chart'));
    let option = {
      tooltip: { trigger: 'axis' },
      legend: { type: 'scroll', bottom: 10 },
      grid: { left: '3%', right: '4%', bottom: '15%', top: '15%' },
      xAxis: { type: 'category', data: [] },
      yAxis: { type: 'value', name: '涨停家数' },
      series: []
    };

    // 加载并渲染真实板块数据
    async function loadData() {
      try {
        const res = await axios.get(FUNCTION_URL);
        const { data: list } = res.data;

        // 提取日期和板块数据
        const dates = list.map(item => item.date).sort();
        const allPlates = new Set();
        list.forEach(item => item.plates.forEach(p => allPlates.add(p.name)));
        const plates = Array.from(allPlates);

        // 组装折线数据
        const series = plates.map(plate => {
          const data = dates.map(date => {
            const day = list.find(d => d.date === date);
            const plateData = day?.plates.find(p => p.name === plate);
            return plateData ? plateData.count : 0;
          });
          return { name: plate, type: 'line', smooth: true, data };
        });

        // 更新图表
        option.xAxis.data = dates;
        option.series = series;
        chart.setOption(option);
        document.getElementById('lastUpdate').innerText = new Date().toLocaleString();
      } catch (err) {
        console.error('加载失败', err);
      }
    }

    // 初始化+每5分钟自动刷新
    loadData();
    setInterval(loadData, 5 * 60 * 1000);
    window.addEventListener('resize', () => chart.resize());
  </script>
</body>
</html>
